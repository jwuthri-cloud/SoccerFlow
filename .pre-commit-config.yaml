# Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
# The guard runs before a commit (git commit) and before a push. Two cases start
# no hook. A commit that another git command makes, such as a merge commit: the push hooks check it.
# A push that sends only names (a tag or a new branch on a commit that the remote has): run
# "python3 tools/guard.py --push" by hand before it.
#
# Every hook has "always_run: true". Without it the hook runner skips a hook when the change has no
# file in the working tree: an empty commit, a push of another branch, a push of a commit whose
# files a later commit removed. The checks read the git index and the commits, not the working tree.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: guard-staged
        name: repository guard (next commit)
        entry: python3 tools/guard.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: guard-push
        name: repository guard (commits and tags to push)
        entry: python3 tools/guard.py --push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
