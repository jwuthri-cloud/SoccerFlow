# Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
# The guard and the secret scan run before a commit (git commit) and before a push. Two cases start
# no hook. A commit that another git command makes, such as a merge commit: the push hooks check it.
# A push that sends only names (a tag or a new branch on a commit that the remote has): run
# "python3 tools/guard.py --push" by hand before it.
#
# Every hook has "always_run: true". Without it the hook runner skips a hook when the change has no
# file in the working tree: an empty commit, a push of another branch, a push of a commit whose
# files a later commit removed. The checks read the git index and the commits, not the working tree.
#
# The secret scan shows the file and the line of a finding (--verbose) and never the secret (--redact).
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: guard-staged
        name: repository guard (next commit)
        entry: python3 tools/guard.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: guard-push
        name: repository guard (commits and tags to push)
        entry: python3 tools/guard.py --push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: gitleaks
        name: gitleaks (staged files, installed binary)
        entry: gitleaks git --pre-commit --staged --redact --verbose --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      # Before a push the whole history is scanned, so a secret that a later commit removed is found too.
      - id: gitleaks-push
        name: gitleaks (history to push, installed binary)
        entry: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
