# Gate thresholds. Fixed before each paid run. They may change once after the free label stage
# (G1), with an entry in docs/DECISIONS.md; after that they are frozen.
#
# Background: the scorer's position similarity is exp(ln(0.05) * d^2 / 25) for an error of d metres:
# 0.7 m -> 0.94, 1 m -> 0.89, 1.2 m -> 0.84, 2 m -> 0.62, 3 m -> 0.34.

version: 1
frozen: false

g0_contract:            # synthetic frames through the real API, per model
  # The contract verdicts of the boxes and the landmarks use the limits in src/pitchvlm/doctor.py
  # (pair share 0.5, median IoU 0.3, median point error 0.05). The next two values are accuracy values.
  box_mean_iou_min: 0.6               # accuracy value: doctor reports it (box accuracy), no verdict
  point_error_max_fraction: 0.01      # of the image side; accuracy value: doctor reports it (landmark accuracy), no verdict
  usage_sum_tolerance: 0.01           # total = input + output + thinking
  flex_valid_answer_rate_min: 0.95
  # One doctor run, all its models together: it stops above the next amount, and it does not start
  # when its estimate is above it. 1.3 times the estimate is not the limit of a doctor run.
  spend_usd_max: 2.0

g1_harness:             # labels only, no model call
  ground_truth_gs_hota_min: 99.5
  shifted_1m_gs_hota: [89.0, 90.0]
  keyframes_only_gs_hota: [7.5, 9.5]
  resampled_2fps_gs_hota_min: 92.0
  team_side_rule_correct_clips_min: 0.97
  label_homography_residual_median_m_max: 0.3

g2_people:              # 120 frames from 24 clips
  recall_min: 0.85
  recall_lower_95_min: 0.80
  precision_min: 0.85
  small_box_max_height_px: 110
  small_box_min_count: 300
  small_box_recall_min: 0.70
  foot_error_median_m_max: 0.7
  foot_error_p90_m_max: 2.0

g3_pitch_mapping:       # same frames plus 3 dev clips
  goal_view_error_median_m_max: 1.2
  midfield_view_error_median_m_max: 2.0
  error_p90_m_max: 3.0
  valid_keyframes_min: 0.85
  kill_switch:
    after_frames: 20
    valid_below: 0.50
    median_error_above_m: 3.0
    overlays_checked_by_eye: 5

g4_identity:            # 6 dev clips
  coverage_min: 0.80
  coverage_worst_clip_min: 0.70
  switches_per_clip_max: 6
  track_ratio_max: 1.5
  gemini_ids_better_on_clips_min: 5   # of 6

g5a_number_reading:     # about 400 tracks cut from ground-truth boxes; upper bound, no gate
  tracks_min: 400

g5b_number_role_side:   # pipeline tracks of the 6 dev clips
  number_exact_match_min: 0.50
  number_stop_spending_below: 0.40
  displayed_number_precision_min: 0.90
  role_accuracy_min: 0.95
  team_side_accuracy_min: 0.95
  swapped_clips_max: 0

g6_freeze_check:        # 6 dev clips, then 3 fresh clips once
  dev_gs_hota_min: 22.0
  fresh_to_dev_ratio_min: 0.8
  usd_per_clip_max: 2.5

success_line:           # 10 test clips, run once after the freeze tag
  test_gs_hota_min: 22.0

budget:
  planned_usd: 120.0
  hard_stop_usd: 135.0
  run_abort_factor: 1.3
  max_usd_per_10_min: 8.0
