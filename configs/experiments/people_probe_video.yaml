# The people probe of gate G2 with video input, on the frames of people_probe.yaml (same group, seed and
# frames per clip). Each target frame goes in its own short video: the frame and 2 frames before and after
# it, 12 frames of the clip apart, written and sampled at 2 frames per second. Compare its metrics file with
# the one of people_probe.yaml (docs/RUNBOOK.md, section 13). Run the doctor video check first.
name: people_probe_video
probe: people
group: probe
frames_per_clip: 5
seed: 20261113
repeat: 0
step:
  provider: gemini
  model: gemini-4-argon
  thinking_level: low
  resolution: high
  service_tier: standard
  coords: yx_1000
video:
  fps: 2.0
  context_frames: 2
  targets_per_request: 1
